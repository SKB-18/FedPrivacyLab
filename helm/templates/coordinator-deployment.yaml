apiVersion: apps/v1
kind: Deployment
metadata:
  name: fedprivacylab-coordinator
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "fedprivacylab.labels" . | nindent 4 }}
    app: coordinator
spec:
  replicas: {{ .Values.coordinator.replicaCount }}
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
    spec:
      containers:
        - name: coordinator
          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.coordinator.port }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            {{- range $k, $v := .Values.coordinator.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.coordinator.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.coordinator.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.coordinator.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: fedprivacylab-data-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
