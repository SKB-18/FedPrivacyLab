apiVersion: apps/v1
kind: Deployment
metadata:
  name: fedprivacylab-dashboard
  namespace: fedprivacylab
  labels:
    app: dashboard
    component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
        component: ui
    spec:
      containers:
        - name: dashboard
          image: fedprivacylab:latest
          ports:
            - containerPort: 8501
          command:
            - "streamlit"
            - "run"
            - "dashboard/streamlit_app.py"
            - "--server.address=0.0.0.0"
            - "--server.port=8501"
            - "--server.headless=true"
          env:
            - name: API_BASE_URL
              value: "http://fedprivacylab-coordinator:8000"
            - name: PYTHONPATH
              value: "/workspace"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: fedprivacylab-data-pvc
